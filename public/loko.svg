<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- BACKGROUND: COMPLETELY TRANSPARENT (NO GREY BG) -->

  <!-- RAILS & SLEEPERS (TIED TRACKS) -->
  <g id="tracks">
    <!-- Sleepers / Ties -->
    <rect x="15" y="196" width="34" height="10" rx="1" fill="#8c533c" />
    <rect x="65" y="196" width="34" height="10" rx="1" fill="#8c533c" />
    <rect x="115" y="196" width="34" height="10" rx="1" fill="#8c533c" />
    <rect x="165" y="196" width="34" height="10" rx="1" fill="#8c533c" />
    <rect x="215" y="196" width="34" height="10" rx="1" fill="#8c533c" />
    <rect x="265" y="196" width="34" height="10" rx="1" fill="#8c533c" />
    <!-- Steel Rails -->
    <rect x="10" y="190" width="300" height="6" rx="1.5" fill="#60656a" />
  </g>

  <!-- REAR COUPLER (RIGHT) -->
  <rect x="296" y="148" width="22" height="6" rx="2" fill="#43484c" />

  <!-- FRONT COWCATCHER (LEFT) -->
  <polygon points="40,186 85,134 85,186" fill="#e95e38" />

  <!-- SMOKESTACK / CHIMNEY -->
  <g id="chimney">
    <polygon points="90,88 95,48 123,48 128,88" fill="#e05338" />
    <!-- Chimney Top Cap -->
    <rect x="91" y="40" width="36" height="10" rx="3" fill="#e05338" />
    <ellipse cx="109" cy="41" rx="16" ry="2.5" fill="#c74127" />
  </g>

  <!-- BOILER CAP (FRONT NOSE) -->
  <path d="M 85,90 C 68,90 68,136 85,136 Z" fill="#e95e38" />

  <!-- BOILER MAIN BODY (YELLOW) -->
  <rect x="83" y="88" width="118" height="48" rx="2" fill="#ffd100" />
  <!-- Boiler Bottom Trim Line (Orange) -->
  <rect x="83" y="132" width="118" height="5" fill="#e95e38" />

  <!-- CABIN (BLUE) -->
  <rect x="198" y="58" width="98" height="80" rx="3" fill="#2792d4" />
  
  <!-- CABIN ROOF (ORANGE) -->
  <rect x="192" y="46" width="110" height="14" rx="5" fill="#e97638" />

  <!-- CABIN WINDOW (LIGHT CYAN) -->
  <polygon points="212,68 284,68 284,98 220,98" fill="#bce8f5" />
  <!-- Window Glare / Reflection -->
  <polygon points="230,68 245,68 235,98 220,98" fill="#dcf3fa" opacity="0.8" />

  <!-- LOWER CHASSIS DECK (BLUE) -->
  <rect x="83" y="136" width="215" height="18" rx="2" fill="#2792d4" />

  <!-- DARK UNDERCARRIAGE BEHIND WHEELS -->
  <rect x="85" y="154" width="210" height="24" rx="4" fill="#3d4246" />

  <!-- WHEELS (3 LARGE WHEELS) -->
  <!-- Wheel 1 (Left) -->
  <g id="wheel1" transform="translate(122, 166)">
    <circle cx="0" cy="0" r="28" fill="#cf1b6a" />
    <circle cx="0" cy="0" r="20" fill="#ffd100" />
    <circle cx="0" cy="0" r="7" fill="#ffffff" />
  </g>

  <!-- Wheel 2 (Middle) -->
  <g id="wheel2" transform="translate(188, 166)">
    <circle cx="0" cy="0" r="28" fill="#cf1b6a" />
    <circle cx="0" cy="0" r="20" fill="#ffd100" />
    <circle cx="0" cy="0" r="7" fill="#ffffff" />
  </g>

  <!-- Wheel 3 (Right) -->
  <g id="wheel3" transform="translate(254, 166)">
    <circle cx="0" cy="0" r="28" fill="#cf1b6a" />
    <circle cx="0" cy="0" r="20" fill="#ffd100" />
    <circle cx="0" cy="0" r="7" fill="#ffffff" />
  </g>
</svg>